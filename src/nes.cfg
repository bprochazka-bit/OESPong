MEMORY {
    ZP:      start = $00,    size = $0100, type = rw, define = yes;
    HEADER:  start = $0,     size = $0010, file = %O, fill = yes;
    PRG:     start = $8000,  size = $8000, file = %O, fill = yes, define = yes;
    CHR:     start = $0000,  size = $2000, file = %O, fill = yes;
    OAMRAM:  start = $0200,  size = $0100, type = rw, define = yes;
    RAM:     start = $0300,  size = $0500, type = rw, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    HEADER:   load = HEADER, type = ro;
    CODE:     load = PRG,    type = ro,  start = $8000;
    RODATA:   load = PRG,    type = ro;
    VECTORS:  load = PRG,    type = ro,  start = $FFFA;
    CHARS:    load = CHR,    type = ro;
    OAM:      load = OAMRAM, type = bss, define = yes;
    BSS:      load = RAM,    type = bss, define = yes;
}
